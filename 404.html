<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Found · Lagom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300..600,0..100,0..1&family=Instrument+Sans:wght@400..600&display=swap">
  <style>
    :root { --paper:#F3EEE4; --ink:#1A1F2B; --ink-2:#474C58; --falu:#9E2B25; --falu-ink:#FBF3EA; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --paper:#12151C; --ink:#EDE6D8; --ink-2:#BDB6A8; --falu:#D9584C; --falu-ink:#1A0E0C; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:"Instrument Sans", system-ui, sans-serif; text-align:center; padding:24px 16px; }
    h1 { margin:0; font-family:"Fraunces", Georgia, serif; font-style:italic; font-weight:340; font-variation-settings:"SOFT" 100, "WONK" 1, "opsz" 144; font-size:clamp(6rem, 26vw, 16rem); line-height:.85; letter-spacing:-.05em; color:var(--falu); }
    p { max-width:36ch; margin:18px auto 0; font-size:18px; color:var(--ink-2); line-height:1.5; }
    p.big { font-family:"Fraunces", Georgia, serif; font-size:clamp(1.4rem, 3vw, 2rem); color:var(--ink); }
    a { display:inline-flex; align-items:center; min-height:50px; margin-top:32px; padding:0 24px; border-radius:999px; background:var(--falu); color:var(--falu-ink); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p class="big">Not too much, not too little. Just nothing.</p>
    <p>This page has gone the way of the leftover screw. It goes nowhere. It has always gone nowhere.</p>
    <a href="/lagom-license/">Close the gate, go home</a>
  </main>
</body>
</html>
